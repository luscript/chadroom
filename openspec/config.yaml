schema: spec-driven

context: |
  Tech stack: Go 1.27 (module "chatroom"), gin v1.12 (HTTP), gorilla/websocket v1.5.3; static index.html client (vanilla JS).
  Architecture: cmd/chatroom/main.go (entrypoint, gin router) + internal/chat (Room hub goroutine + Client read/write pumps over channels).
  Testing: none yet; use stdlib `testing` + `go test -race ./...` (net/http/httptest for WebSocket tests).
  Style: gofmt defaults, no linter config; small files, exported constructors (NewRoom), unexported pumps; errors logged with log.Println.
  API: GET /ws?nickname=<name> (WebSocket upgrade, text messages broadcast to all clients). No auth.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists (go test -race ./...)
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

project_map:
  auto_refresh: advise
  staleness:
    threshold: 5
  refresh:
    default_scope: incremental
