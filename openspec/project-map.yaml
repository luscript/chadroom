modules:
  - name: chatroom-cmd
    path: cmd/chatroom
    description: "Composition root. main reads ALLOWED_ORIGINS, GIPHY_API_KEY and YOUTUBE_API_KEY (trimmed) into config and calls serve(ctx, addr, cfg) -> run(ctx, listener, cfg) with signal.NotifyContext (SIGINT/SIGTERM), listening on const addr :8080. run builds the chat.Server via newChatServer (one room per roomIDs entry: general, juegos, musica; the first is the default; chat.NewMusicRoom for musicRoom = \"musica\", chat.NewRoom for the rest; validAvatar is passed to chat.NewServer), starts Server.Run, starts an http.Server (ReadHeaderTimeout 10s, IdleTimeout 60s, MaxHeaderBytes 8KiB), and shuts down gracefully (cancel, wait for rooms to close their websockets, srv.Shutdown 5s); it returns an exit code. A gifSearch is created only when GIPHY_API_KEY is non-empty, otherwise it logs that GIF search is disabled. newRouter (gin.Default, no trusted proxies): GET / (servePage: nosniff, Cache-Control no-cache, Content-Security-Policy, X-Frame-Options DENY, Referrer-Policy no-referrer), GET /app.js, /app.css, /favicon.svg and /favicon-unread.svg (serveAsset: exact content type, nosniff, no-cache), GET /rooms (serveRooms: {\"rooms\":[...]}), GET /ws (chat.Server.HandleWebSocket), GET /gifs (registered only if gifSearch != nil), GET /playlist (registered only if playlistImport != nil; YOUTUBE_API_KEY unset logs that playlist import is disabled). imageHosts (media/media0-4/i.giphy.com, media.tenor.com, i.imgur.com) is the single source for CSP img-src via buildCSP (default-src 'none'; script/style/connect 'self'; frame-src only youtubeEmbedHost https://www.youtube-nocookie.com; base-uri/form-action 'none'; frame-ancestors 'none'; no media-src) and is mirrored by IMAGE_HOSTS in app.js (TestImageHostsMirroredInJS). validAvatar (maxAvatarBytes 512, mirrored by MAX_AVATAR_BYTES) accepts a profile-picture URL only if https, exact imageHosts host (no port), no userinfo/fragment/whitespace, image extension gif|webp|png|jpe?g; it is relayed verbatim, never rewritten (CHAT-28). musicRoom is mirrored by MUSIC_ROOM in app.js. parseAllowedOrigins trims blanks and drops \"null\". gifs.go: gifSearch proxies Giphy trending/search (giphyAPI https://api.giphy.com; limit 24, rating pg-13, lang es; q trimmed, max 50 runes, else 400 query_too_long; 5s client timeout, redirects not followed, body capped at 1 MiB; TTL cache 10 min, max 100 entries, keyed by lowercased q, guarded by a mutex, empty results are not cached; upstream failure returns 502 {\"error\":\"unavailable\"}). canonicalGIF accepts only https, an exact host in imageHosts that is also a giphy.com host, a .gif path, no userinfo/port/opaque, and strips query and fragment. The API key is never logged or returned (fetch discards the *url.Error). Response is {\"gifs\":[{\"url\",\"preview\"}]}. playlist.go: playlistImport expands a YouTube playlist (youtubeAPI https://www.googleapis.com/youtube/v3): list must match playlistID ^[A-Za-z0-9_-]{10,64}$ (else 400 invalid_list); playlistItems.list part=contentDetails maxResults=50 (first page), ids re-validated, deduped, capped at 50, then one videos.list part=status keeping only processed + public|unlisted + embeddable ids present in the answer (fail closed); key only in the X-Goog-Api-Key header, CheckRedirect blocks redirects, one 5 s context deadline for both calls, 1 MiB LimitReader, fixed error strings (youtubeStatusError prints only the code); 404 or 403 playlistItemsNotAccessible -> 404 not_found, anything else -> 502 unavailable; TTL cache 10 min / 100 entries keyed by list id (case-sensitive), only non-empty results; response {\"videos\":[...]} never null."
    language: go
    entry_points:
      - cmd/chatroom/main.go
      - cmd/chatroom/gifs.go
      - cmd/chatroom/playlist.go
    test_paths:
      - cmd/chatroom/main_test.go
      - cmd/chatroom/gifs_test.go
      - cmd/chatroom/playlist_test.go
  - name: chat
    path: internal/chat
    description: "Chat hub. server.go = Server over a fixed set of rooms (NewServer(allowedOrigins, rooms...) panics on no rooms or an empty/duplicate id); Run starts every room (WaitGroup); HandleWebSocket resolves ?room= (missing -> default room, unknown -> 404 before upgrade), upgrades (1024-byte buffers) with checkOrigin (same host case-insensitively, no Origin, or ALLOWED_ORIGINS; \"null\" rejected -> 403), then room.serveConn(conn, normalizeNickname(?nickname), avatar) where ?avatar is kept only if the injected validAvatar accepts it (invalid or nil validator -> joins without a picture, never rejected; NewServer(allowedOrigins, validAvatar, rooms...)). room.go = Room (id, clients, taken set of foldKey(nickname), history window, dropped, player *player (nil except in rooms built by NewMusicRoom), broadcast chan inbound carrying every kind so a client's frames stay ordered, register/unregister/done; consts sendBufferSize 256, maxNicknameRunes 32, write wait 10s, pong wait 60s, ping period 0.9*pong, max message 4096; timing fields are unexported so tests shorten them). Only Run touches the registry and closes send (no locks). admit assigns the final nickname, closes client.registered, privately delivers welcome, users and history, then (music room with a current video) the music snapshot, then publishes join. dispatch routes by kind: chat -> relay (store in history, fan out), dm -> direct (deliver to recipient and echo to sender, never stored; dm_error invalid|self|offline to the sender only), typing -> best-effort via offer (never stored, never drops a client; room signal excludes the sender, DM signal goes to the recipient only, self/offline are silent), music -> Room.music applies the control to the shared player and publishes the new music frame to the whole room including the sender (must-have delivery, never stored; ignored when the room has no player or the control does not apply). When the last client leaves, the player is halted (paused at its position). leave drains queued inbound before removing c; deliver/fanOut are non-blocking and remove slow clients (announced as leave via announceDropped); remove() is the single removal path. message.go = outbound JSON frames with a unix-ms ts: message{type,from,text,ts[,avatar]} for chat/join/leave/welcome (avatar omitted when empty and never on leave), usersFrame{users []string sorted by foldKey, avatars map nick->url omitted when empty}, historyFrame{messages, historySize 50}, dmFrame{from,to,text}, dmErrorFrame{to,reason}, typingFrame{from}, typingDMFrame{from,to} and musicFrame{video,playing,pos,by,seq,queue[],ts}. parseInbound classifies text frames: JSON object with exact-key type dm/typing/music/chat (a music frame is fully validated by parseMusic and an invalid one is discarded, not turned into chat; jsonInt rejects null/strings/fractions/exponents), otherwise the whole frame is plain chat text (an unknown type falls back to chat text); blank frames are dropped silently. music.go = the shared player of the music room (CHAT-30), owned by Room.Run (no locks): player{video,playing,pos,at,by,seq,queue,nextID,finished} with position(now), start, advance, apply(cmd,by,now) bool, halt and frame(now), driven by musicCmd actions add_many (videos: 1..maxMusicAddMany 50 ids, each matching the id regex, whole control discarded on any bad element; applied atomically: idle -> first becomes current, rest fill free queue slots, overflow dropped, one frame, none if nothing fits), add (video must match ^[A-Za-z0-9_-]{11}$; becomes current when nothing is current or the last track finished with an empty queue, else queued up to maxMusicQueue 50), remove (by queue item id), skip (advances the queue), ended (accepted only for the current seq, auto-advances or marks finished), play, pause, seek (pos 0..24h ms); queueItem{id,video,by}. Positions are computed server-side when the frame is built so client clock skew does not matter. nickname.go = cleanNickname/normalizeNickname (ToValidUTF8, strip Cc + Bidi_Control, trim, 32 runes, \"Anonymous\"), truncateRunes, foldKey (SimpleFold orbit minimum), Room.assignNickname (lowest free \" (n)\" suffix, n>=2). client.go = Client (conn, send, registered, nickname); readPump (read limit, deadlines refreshed on any frame and on pong; binary -> close 1003, invalid UTF-8 -> close 1007; rateGate{interval} (replaces typingGate) allows at most 1 typing signal/s per connection and, separately, music controls every musicInterval 260 ms plus an independent gate for `ended` so a click cannot starve an end report (over budget -> frame dropped, connection stays open); Client also carries the validated avatar; unregisters on exit) and writePump (sole writer, pings, close frame on send closed); logError skips normal closes. Test helpers (room_test.go): startRoom, newTestClient, register, broadcast, joinAll, dm, typingSignal, expect*/decode*, frameFields/exactFields; server_test.go: joinRoom, dialOriginRoom."
    language: go
    entry_points:
      - internal/chat/server.go
      - internal/chat/room.go
      - internal/chat/client.go
      - internal/chat/message.go
      - internal/chat/nickname.go
      - internal/chat/music.go
    test_paths:
      - internal/chat/room_test.go
      - internal/chat/client_test.go
      - internal/chat/server_test.go
  - name: web-client
    path: cmd/chatroom
    description: "Browser client (Spanish voseo UI; Nocturne token theme overridden by a retro 'pinkroom' theme appended at the end of app.css with long minified lines), embedded via go:embed (index.html, app.js, app.css, favicon.svg, favicon-unread.svg). index.html has no inline code (CSP, guarded by TestIndexHasNoInlineCode); join form #join-form with #nick and an optional #avatar-url (profile picture, validated like the server, remembered in localStorage key chadroom.avatar, sent as ?avatar=); header with #users-btn/#users-panel popover; .chat-main = nav.rooms, #scroller, #typing, form.composer (emoji and GIF popovers); aside.scrapbook 'MI PERFIL' (#profile-nick, #profile-avatar img, .profile-art; hidden at <=800px). app.js (IIFE): loadRooms() from GET /rooms (room ids validated by ^[a-z0-9-]{1,32}$); one pane/WebSocket per joined room via connect(room) to ws(s)://host/ws?room=<id>&nickname=<nick>[&avatar=<url>]; online only on welcome (room.myName); activate(room, conv) is the single room-switch hook; reconnect with exponential backoff and jitter (RETRY_BASE_MS 1000, RETRY_MAX_MS 30000, reset on welcome), reconnectNow on window online / tab visible; MAX_MESSAGE_BYTES 4096. Handles inbound frames by type: welcome, users (renderUsers, room.users Set<string>, room.avatars Map nick->url filtered through isAllowedImage), history (renderHistory -> addChat), join/leave, chat, dm, dm_error (showDMError) typing and music (only in the music room). addChat(pane, author, text, ts, avatarUrl) renders li.msg > div.avatar-slot (avatar only when author changes: avatarEl gives the <img> when the sender has a valid picture, else the letter div.avatar) + div.msg-body; same path for rooms, DMs and history. Private conversations (createConversation/openConversation, per-peer tabs, unread badges) send JSON {type:\"dm\",to,text}. Typing: notifyTyping throttled to TYPING_SEND_MS 3000, remote typist expires after TYPING_TTL_MS 5000. Panels registry {emoji,gif,users} with togglePanel/closePanels (Escape, outside click). GIF panel: loadGifs(q) calls GET /gifs?q= with a 300 ms debounce, disableGifSearch() when /gifs is missing; isAllowedImage (https, exact host in IMAGE_HOSTS, no port/credentials/fragment, extension gif|webp|png|jpe?g) decides inline <img> (referrerPolicy no-referrer) vs text. Music room (MUSIC_ROOM 'musica', mirrors the server): a YouTube player in a youtube-nocookie iframe driven through postMessage (YT_ORIGIN check, handshake every 250 ms up to 40 tries), kept in sync with server music frames (onMusicFrame/renderMusic; drift tolerance MUSIC_DRIFT_MS, settle/stale windows), sending add/remove/skip/ended/play/pause/seek as JSON {type:\"music\",action,...} spaced MUSIC_SEND_GAP_MS 300 (above the server's 260 ms gate); the shared queue (MUSIC_QUEUE_MAX 50 and MUSIC_ADD_MANY_MAX 50 mirror maxMusicQueue/maxMusicAddMany, TestMusicLimitsMirroredInJS) is rendered with the track title as a caption; links accepted (parseYouTubeLink -> {video, list}): youtube.com watch / shorts, youtu.be, music.youtube.com (11-char id), plus playlist links /playlist?list= and watch?v=X&list= (YT_LIST_ID ^[A-Za-z0-9_-]{10,64}$, mirrored by playlistID, TestPlaylistIDMirroredInJS): importPlaylist fetches GET /playlist, dedupes with X first, truncates to freeSlots(), sends one add_many, shows fixed PLAYLIST_TEXT messages (importing flag + importSeq token, Poner disabled while importing, resetMusic invalidates); mix lists (RD...) add only the video; the page reports `ended` per seq (player state, duration grace or clock plateau) with retry. Global playback (CHAT-31/34): musicShown() gates only the pane UI; playerActive() (frame && joined) gates tick/reconcile/ended, so music keeps following the room in other panes; when not shown #music is parked off-screen (.parked, inert, never display:none, iframe never reparented); music.seen (pane shown once since joining) allows off-pane frame creation (not while blocked); header #music-global-mute 🎵/🔇 shares music.muted with #music-mute, persisted chadroom.musicMuted; read-only #music-now-playing (♪/⏸ title, 'Abrí #musica para escuchar', 'Audio bloqueado: abrí #musica'); shared controls only in the pane. Notifications (CHAT-32/33): notify(paneIsCurrent) is called from the live chat/dm cases only (never history/own); unattended() = document.hidden || !document.hasFocus(); playBlip is a Web Audio blip (lazy AudioContext unlocked on join/unmute, resume-then-schedule, BLIP_LEAD_S 0.12 lead-in, BLIP_GAP_MS 1000); #mute-btn 🔔/🔕 mutes sound only; while unattended the title shows (N) and link[rel=icon] swaps /favicon.svg -> /favicon-unread.svg, reset on focus/visible/leave. textContent only, no innerHTML; localStorage only for the avatar URL, chadroom.muted and chadroom.musicMuted (best effort)."
    language: html/javascript/css
    entry_points:
      - cmd/chatroom/index.html
      - cmd/chatroom/app.js
      - cmd/chatroom/app.css
    test_paths:
      - cmd/chatroom/main_test.go
  - name: openspec
    path: openspec
    description: "Spec-Driven Development artifacts: specs/{chat,server}/spec.md (current requirements CHAT-01..CHAT-34, SRV-01..SRV-09), changes/<name>/ (active changes in progress), changes/archive/YYYY-MM-DD-<slug>/ (14 completed changes: fix-channel-handling, structured-messages, frontend-hardening, online-users-and-history, multiple-rooms, private-chat, typing-indicator, gif-picker, profile-picture, room-music-sync, music-queue, chat-notifications, global-music, youtube-playlist-import), backlog.md (future changes), config.yaml (SDD rules, project_map auto_refresh advise, threshold 5), project-map.yaml"
    language: markdown
    entry_points:
      - openspec/backlog.md
      - openspec/config.yaml
    test_paths: []

