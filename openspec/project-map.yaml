modules:
  - name: chatroom-cmd
    path: cmd/chatroom
    description: "Composition root. main wires signal.NotifyContext (SIGINT/SIGTERM) and ALLOWED_ORIGINS into serve(ctx, addr, origins) -> run(ctx, listener, origins), which starts Room.Run, an http.Server (ReadHeaderTimeout/IdleTimeout/MaxHeaderBytes) and graceful shutdown returning an exit code. newRouter (gin, no trusted proxies): GET / (servePage: nosniff, Cache-Control no-cache, Content-Security-Policy, X-Frame-Options DENY), GET /app.js and /app.css (serveAsset: exact content type, nosniff, no-cache), GET /ws. imageHosts (Giphy/Tenor/Imgur) is the single source for CSP img-src via buildCSP and is mirrored by IMAGE_HOSTS in app.js (TestImageHostsMirroredInJS). parseAllowedOrigins trims blanks and drops \"null\". Listens on :8080"
    language: go
    entry_points:
      - cmd/chatroom/main.go
    test_paths:
      - cmd/chatroom/main_test.go
  - name: chat
    path: internal/chat
    description: "Chat hub. room.go = Room (clients registry + taken set of foldKey(nickname), both owned by Run(ctx); broadcast chan inbound{from,text}; Run assigns the final nickname on register, closes client.registered, delivers welcome then fans out join; drops chat from non-members; leave(c) relays c's already-queued inbound before removing it (re-checks membership after the drain); deliver/fanOut non-blocking with silent slow-client drop; remove() is the single removal path; done chan, checkOrigin allowlist, HandleWebSocket waits on registered before starting pumps). message.go = JSON envelope {type,from,text,ts} (chat/join/leave/welcome), encode marshals once per event. nickname.go = normalizeNickname (ToValidUTF8, strip Cc + Bidi_Control, trim, 32 runes, \"Anonymous\"), truncateRunes, foldKey (EqualFold-equivalent key), assignNickname (lowest free \" (n)\" suffix). client.go = Client (conn, send, registered, nickname) with readPump (4096-byte limit, deadlines, pong; closes on binary/invalid UTF-8; drops blank frames) and writePump (sole conn writer, pings)"
    language: go
    entry_points:
      - internal/chat/room.go
      - internal/chat/client.go
      - internal/chat/message.go
      - internal/chat/nickname.go
    test_paths:
      - internal/chat/room_test.go
      - internal/chat/client_test.go
  - name: web-client
    path: cmd/chatroom
    description: "Browser client (Nocturne design, Spanish UI), all embedded via go:embed. index.html has no inline code (CSP, guarded by TestIndexHasNoInlineCode) and loads app.css + app.js. app.js: join form; connect() to ws(s)://location.host/ws with the typed nickname; online only on welcome; on unexpected close scheduleReconnect() with exponential backoff + equal jitter (1 s doubling, 30 s cap, reset on welcome), one lost/reconnected notice per outage, reconnectNow() on window online / tab visible, Salir cancels the timer; enforces MAX_MESSAGE_BYTES=4096; emoji panel; GIF panel (URL pasted); isAllowedImage (new URL, https, exact host in IMAGE_HOSTS, no port/credentials/fragment, image extension) decides inline <img> vs text; parses frames as JSON by type (unknown ignored), identity from welcome, own iff from === welcome name; textContent only; Inter from Google Fonts"
    language: html/javascript/css
    entry_points:
      - cmd/chatroom/index.html
      - cmd/chatroom/app.js
      - cmd/chatroom/app.css
    test_paths:
      - cmd/chatroom/main_test.go
  - name: openspec
    path: openspec
    description: "Spec-Driven Development artifacts: specs/{chat,server}/spec.md (current requirements CHAT-xx, SRV-xx), changes/<name>/ (active change: proposal, specs deltas, design, tasks), changes/archive/ (completed changes), backlog.md (future changes grouped by name), config.yaml (SDD rules)"
    language: markdown
    entry_points:
      - openspec/backlog.md
      - openspec/config.yaml
    test_paths: []

