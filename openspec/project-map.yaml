modules:
  - name: chatroom-cmd
    path: cmd/chatroom
    description: "Composition root. main reads ALLOWED_ORIGINS and GIPHY_API_KEY (trimmed) into config and calls serve(ctx, addr, cfg) -> run(ctx, listener, cfg) with signal.NotifyContext (SIGINT/SIGTERM), listening on const addr :8080. run builds the chat.Server via newChatServer (one chat.NewRoom per roomIDs entry: general, juegos, musica; the first is the default), starts Server.Run, starts an http.Server (ReadHeaderTimeout 10s, IdleTimeout 60s, MaxHeaderBytes 8KiB), and shuts down gracefully (cancel, wait for rooms to close their websockets, srv.Shutdown 5s); it returns an exit code. A gifSearch is created only when GIPHY_API_KEY is non-empty, otherwise it logs that GIF search is disabled. newRouter (gin.Default, no trusted proxies): GET / (servePage: nosniff, Cache-Control no-cache, Content-Security-Policy, X-Frame-Options DENY, Referrer-Policy no-referrer), GET /app.js and /app.css (serveAsset: exact content type, nosniff, no-cache), GET /rooms (serveRooms: {\"rooms\":[...]}), GET /ws (chat.Server.HandleWebSocket), GET /gifs (registered only if gifSearch != nil). imageHosts (media/media0-4/i.giphy.com, media.tenor.com, i.imgur.com) is the single source for CSP img-src via buildCSP (default-src 'none'; script/style/connect 'self'; base-uri/form-action 'none'; frame-ancestors 'none'; no media-src/frame-src) and is mirrored by IMAGE_HOSTS in app.js (TestImageHostsMirroredInJS). parseAllowedOrigins trims blanks and drops \"null\". gifs.go: gifSearch proxies Giphy trending/search (giphyAPI https://api.giphy.com; limit 24, rating pg-13, lang es; q trimmed, max 50 runes, else 400 query_too_long; 5s client timeout, redirects not followed, body capped at 1 MiB; TTL cache 10 min, max 100 entries, keyed by lowercased q, guarded by a mutex, empty results are not cached; upstream failure returns 502 {\"error\":\"unavailable\"}). canonicalGIF accepts only https, an exact host in imageHosts that is also a giphy.com host, a .gif path, no userinfo/port/opaque, and strips query and fragment. The API key is never logged or returned (fetch discards the *url.Error). Response is {\"gifs\":[{\"url\",\"preview\"}]}."
    language: go
    entry_points:
      - cmd/chatroom/main.go
      - cmd/chatroom/gifs.go
    test_paths:
      - cmd/chatroom/main_test.go
      - cmd/chatroom/gifs_test.go
  - name: chat
    path: internal/chat
    description: "Chat hub. server.go = Server over a fixed set of rooms (NewServer(allowedOrigins, rooms...) panics on no rooms or an empty/duplicate id); Run starts every room (WaitGroup); HandleWebSocket resolves ?room= (missing -> default room, unknown -> 404 before upgrade), upgrades (1024-byte buffers) with checkOrigin (same host case-insensitively, no Origin, or ALLOWED_ORIGINS; \"null\" rejected -> 403), then room.serveConn(conn, normalizeNickname(?nickname)). room.go = Room (id, clients, taken set of foldKey(nickname), history window, dropped, broadcast chan inbound carrying every kind so a client's frames stay ordered, register/unregister/done; consts sendBufferSize 256, maxNicknameRunes 32, write wait 10s, pong wait 60s, ping period 0.9*pong, max message 4096; timing fields are unexported so tests shorten them). Only Run touches the registry and closes send (no locks). admit assigns the final nickname, closes client.registered, privately delivers welcome, users and history, then publishes join. dispatch routes by kind: chat -> relay (store in history, fan out), dm -> direct (deliver to recipient and echo to sender, never stored; dm_error invalid|self|offline to the sender only), typing -> best-effort via offer (never stored, never drops a client; room signal excludes the sender, DM signal goes to the recipient only, self/offline are silent). leave drains queued inbound before removing c; deliver/fanOut are non-blocking and remove slow clients (announced as leave via announceDropped); remove() is the single removal path. message.go = outbound JSON frames with a unix-ms ts: message{type,from,text,ts} for chat/join/leave/welcome (no omitempty), usersFrame{users []string sorted by foldKey}, historyFrame{messages, historySize 50}, dmFrame{from,to,text}, dmErrorFrame{to,reason}, typingFrame{from} and typingDMFrame{from,to}. parseInbound classifies text frames: JSON object with exact-key type dm/typing/chat, otherwise the whole frame is plain chat text (an unknown type falls back to chat text); blank frames are dropped silently. nickname.go = cleanNickname/normalizeNickname (ToValidUTF8, strip Cc + Bidi_Control, trim, 32 runes, \"Anonymous\"), truncateRunes, foldKey (SimpleFold orbit minimum), Room.assignNickname (lowest free \" (n)\" suffix, n>=2). client.go = Client (conn, send, registered, nickname); readPump (read limit, deadlines refreshed on any frame and on pong; binary -> close 1003, invalid UTF-8 -> close 1007; typingGate allows at most 1 typing signal/s per connection; unregisters on exit) and writePump (sole writer, pings, close frame on send closed); logError skips normal closes. Test helpers (room_test.go): startRoom, newTestClient, register, broadcast, joinAll, dm, typingSignal, expect*/decode*, frameFields/exactFields; server_test.go: joinRoom, dialOriginRoom."
    language: go
    entry_points:
      - internal/chat/server.go
      - internal/chat/room.go
      - internal/chat/client.go
      - internal/chat/message.go
      - internal/chat/nickname.go
    test_paths:
      - internal/chat/room_test.go
      - internal/chat/client_test.go
      - internal/chat/server_test.go
  - name: web-client
    path: cmd/chatroom
    description: "Browser client (Spanish voseo UI; Nocturne token theme overridden by a retro 'pinkroom' theme appended at the end of app.css with long minified lines), embedded via go:embed (index.html, app.js, app.css). index.html has no inline code (CSP, guarded by TestIndexHasNoInlineCode); join form #join-form with a single #nick field; header with #users-btn/#users-panel popover; .chat-main = nav.rooms, #scroller, #typing, form.composer (emoji and GIF popovers); aside.scrapbook 'MI PERFIL' (#profile-nick, .profile-art; hidden at <=800px). app.js (IIFE): loadRooms() from GET /rooms (room ids validated by ^[a-z0-9-]{1,32}$); one pane/WebSocket per joined room via connect(room) to ws(s)://host/ws?room=<id>&nickname=<nick>; online only on welcome (room.myName); activate(room, conv) is the single room-switch hook; reconnect with exponential backoff and jitter (RETRY_BASE_MS 1000, RETRY_MAX_MS 30000, reset on welcome), reconnectNow on window online / tab visible; MAX_MESSAGE_BYTES 4096. Handles inbound frames by type: welcome, users (renderUsers, room.users Set<string>), history (renderHistory -> addChat), join/leave, chat, dm, dm_error (showDMError) and typing. addChat(pane, author, text, ts) renders li.msg > div.avatar-slot (letter div.avatar only when author changes) + div.msg-body; same path for rooms, DMs and history. Private conversations (createConversation/openConversation, per-peer tabs, unread badges) send JSON {type:\"dm\",to,text}. Typing: notifyTyping throttled to TYPING_SEND_MS 3000, remote typist expires after TYPING_TTL_MS 5000. Panels registry {emoji,gif,users} with togglePanel/closePanels (Escape, outside click). GIF panel: loadGifs(q) calls GET /gifs?q= with a 300 ms debounce, disableGifSearch() when /gifs is missing; isAllowedImage (https, exact host in IMAGE_HOSTS, no port/credentials/fragment, extension gif|webp|png|jpe?g) decides inline <img> (referrerPolicy no-referrer) vs text. textContent only, no innerHTML; no localStorage."
    language: html/javascript/css
    entry_points:
      - cmd/chatroom/index.html
      - cmd/chatroom/app.js
      - cmd/chatroom/app.css
    test_paths:
      - cmd/chatroom/main_test.go
  - name: openspec
    path: openspec
    description: "Spec-Driven Development artifacts: specs/{chat,server}/spec.md (current requirements CHAT-01..CHAT-27, SRV-01..SRV-08), changes/<name>/ (active changes), changes/archive/YYYY-MM-DD-<slug>/ (8 completed changes: fix-channel-handling, structured-messages, frontend-hardening, online-users-and-history, multiple-rooms, private-chat, typing-indicator, gif-picker), backlog.md (future changes), config.yaml (SDD rules, project_map auto_refresh advise, threshold 5), project-map.yaml"
