conventions:
  commit_style: "Conventional Commits, type(scope): subject (e.g. feat(gifs):, feat(chat):, feat(music):, fix(music):, docs:); PRs merged via GitHub merge commits (\"Merge pull request #N from luscript/feat/...\")"
  branch_naming: "type/slug (feat/gif-picker, feat/room-music-sync, fix/music-title-handshake); main is default"
  code_style: "gofmt (snap: use /snap/go/current/bin/gofmt); no golangci-lint config; hub pattern (only Room.Run touches clients and closes send; no locks); no inline code in the page (strict CSP); image hosts in imageHosts and IMAGE_HOSTS must match; musicRoom/MUSIC_ROOM, maxAvatarBytes/MAX_AVATAR_BYTES and maxMusicQueue/MUSIC_QUEUE_MAX, maxMusicAddMany/MUSIC_ADD_MANY_MAX and playlistID/YT_LIST_ID are mirrored by hand (each guarded by a test)"
  documentation: "short Go doc comments above types/functions that explain the why, citing spec IDs (CHAT-xx/SRV-xx); README.md documents API and protocol; CLAUDE.md for project rules"
  examples:
    - "Constructor pattern: NewRoom(id) *Room and NewServer(allowedOrigins, rooms...) *Server return fully initialized structs; programmer errors panic in NewServer"
    - "Goroutine pumps per connection: serveConn waits on client.registered, then go writePump + go readPump; writePump owns all conn writes, readPump owns unregister, only Room.Run closes send"
    - "Error handling: c.logError(roomID, op, err) logs only abnormal closes; no wrapping or custom error types; gifs.fetch returns sanitized errors.New(...) so the API key never leaks; playlist.get does the same and sends the YouTube key only as a header"
    - "Testability seams: unexported Room timing fields, gifSearch.baseURL/client/now injectable; player methods take now so position math is deterministic"

api_surface:
  - name: WebSocket chat endpoint
    type: REST
    path: GET /ws?room=<id>&nickname=<string>
    description: "Upgrades to WebSocket. room: general|juegos|musica; missing/empty -> general; unknown -> 404 (no upgrade). avatar (optional): an https image URL on an allowed image host, <=512 bytes; invalid -> joins without a picture. Inbound text frames <=4096 bytes (binary closes 1003, invalid UTF-8 closes 1007): plain text or JSON {type:chat,text} | {type:dm,to,text} | {type:typing[,to]} (typing max 1/s per connection) | {type:music,action:add|add_many|remove|skip|ended|play|pause|seek,...} (only meaningful in musica; add{video}, add_many{videos:[1..50 ids]}, remove{id}, ended{seq}, seek{pos}; max ~4/s, `ended` has its own gate; invalid or inapplicable controls are dropped); blank ignored. Outbound JSON with ts in Unix ms: welcome (first frame, assigned nickname[, avatar]), users {users:[][,avatars:{nick:url}]}, history {messages:[] <=50}, join/chat {type,from,text,ts[,avatar]}, leave {type,from,text,ts}, music {video,playing,pos,by,seq,queue:[{id,video,by}] (<=50)} (musica only: snapshot after history when a track exists, then on every applied control; never stored), dm {from,to,text} (to recipient and echoed to sender), dm_error {to,reason: invalid|self|offline}, typing {from[,to]}. Nicknames normalized (control/bidi stripped, trimmed, <=32 runes, \"Anonymous\") and unique case-insensitively per room via \" (n)\" suffix"
    auth: null (Origin check - same host, no Origin header, or ALLOWED_ORIGINS; "null" rejected with 403)
  - name: Room list
    type: REST
    path: GET /rooms
    description: "Returns {\"rooms\":[\"general\",\"juegos\",\"musica\"]} in display order (default first), with nosniff and no-cache"
    auth: null
  - name: GIF search proxy
    type: REST
    path: GET /gifs?q=<string>
    description: "Only registered when GIPHY_API_KEY is set (otherwise 404). Proxies Giphy trending (q empty) or search; returns {\"gifs\":[{\"url\",\"preview\"}]} (max 24, pg-13, lang es, https giphy .gif URLs only). q over 50 runes -> 400 {\"error\":\"query_too_long\"}; upstream failure -> 502 {\"error\":\"unavailable\"}. 10 min TTL cache, 100 entries. Key never logged or returned"
    auth: null (server holds GIPHY_API_KEY)
  - name: Playlist expansion proxy
    type: REST
    path: GET /playlist?list=<id>
    description: "Only registered when YOUTUBE_API_KEY is set (otherwise 404). Expands a YouTube / YouTube Music playlist via the YouTube Data API v3 into {\"videos\":[ids]} (<=50, first page, playlist order, only playable: processed, public|unlisted, embeddable). Invalid list -> 400 {\"error\":\"invalid_list\"}; not found/private -> 404 {\"error\":\"not_found\"}; upstream failure, quota, redirect or timeout (5 s total) -> 502 {\"error\":\"unavailable\"}. 10 min TTL cache, 100 entries. Key sent only in X-Goog-Api-Key, never logged or returned. No rate limit (backlog)"
    auth: null (server holds YOUTUBE_API_KEY)
  - name: Chat page
    type: REST
    path: GET /
    description: "Serves the embedded index.html with nosniff, Cache-Control no-cache, X-Frame-Options DENY, Referrer-Policy no-referrer and a strict Content-Security-Policy (no unsafe-inline; img-src 'self' + imageHosts over https; frame-src https://www.youtube-nocookie.com; connect-src 'self')"
    auth: null
  - name: Page assets
    type: REST
    path: GET /app.js, GET /app.css, GET /favicon.svg, GET /favicon-unread.svg
    description: "Embedded script, stylesheet and favicons (text/javascript, text/css; charset=utf-8, image/svg+xml) with nosniff and no-cache"
    auth: null
