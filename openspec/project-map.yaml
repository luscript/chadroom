conventions:
  commit_style: "Conventional Commits, type(scope): subject (e.g. fix(chat):, feat(ui):, docs:); first commit was \"Initial commit\""
  branch_naming: "type/slug (fix/channel-handling, feat/structured-messages); main is default"
  code_style: gofmt; no golangci-lint config
  documentation: short Go doc comments above types/functions
  examples:
    - "Constructor pattern: func NewRoom(allowedOrigins []string) *Room returns a fully initialized struct with made channels"
    - "Goroutine pumps per connection: go client.writePump(cr); go client.readPump(cr) — readPump owns unregister, writePump owns all conn writes; only Room.Run closes send"
    - "Error handling: c.logError(\"Read\", err) (logs only abnormal closes) then return; no wrapping, no custom error types"

api_surface:
  - name: WebSocket chat endpoint
    type: REST
    path: GET /ws?nickname=<string>
    description: "Upgrades to WebSocket. Inbound: plain UTF-8 text frames <=4096 bytes (blank ones ignored). Outbound: JSON {\"type\",\"from\",\"text\",\"ts\"} with type chat|join|leave|welcome (text \"\" for non-chat, ts Unix ms); welcome is the first frame and carries the assigned nickname. Nicknames normalized (control/bidi stripped, trimmed, <=32 runes, \"Anonymous\") and unique case-insensitively via \" (n)\" suffix"
    auth: null (Origin check - same-origin or ALLOWED_ORIGINS; null rejected)
  - name: Chat page
    type: REST
    path: GET /
    description: "Serves the embedded index.html with nosniff, Cache-Control no-cache, X-Frame-Options DENY and a strict Content-Security-Policy (no unsafe-inline; img-src 'self' + allowlisted image hosts; connect-src 'self')"
    auth: null
  - name: Page assets
    type: REST
    path: GET /app.js, GET /app.css
    description: "Embedded script and stylesheet (text/javascript, text/css; charset=utf-8) with nosniff and no-cache"
    auth: null
