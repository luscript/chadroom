modules:
  - name: chatroom-cmd
    path: cmd/chatroom
    description: "Composition root. main wires signal.NotifyContext (SIGINT/SIGTERM) and ALLOWED_ORIGINS into serve(ctx, addr, origins) -> run(ctx, listener, origins), which starts Room.Run, an http.Server (ReadHeaderTimeout/IdleTimeout/MaxHeaderBytes) and graceful shutdown returning an exit code. newRouter (gin, no trusted proxies): GET / serves embedded index.html with nosniff + X-Frame-Options DENY, GET /ws. parseAllowedOrigins trims blanks and drops \"null\". Listens on :8080"
    language: go
    entry_points:
      - cmd/chatroom/main.go
    test_paths:
      - cmd/chatroom/main_test.go
  - name: chat
    path: internal/chat
    description: "Chat hub. room.go = Room (clients registry + taken set of foldKey(nickname), both owned by Run(ctx); broadcast chan inbound{from,text}; Run assigns the final nickname on register, closes client.registered, delivers welcome then fans out join; drops chat from non-members; leave(c) relays c's already-queued inbound before removing it (re-checks membership after the drain); deliver/fanOut non-blocking with silent slow-client drop; remove() is the single removal path; done chan, checkOrigin allowlist, HandleWebSocket waits on registered before starting pumps). message.go = JSON envelope {type,from,text,ts} (chat/join/leave/welcome), encode marshals once per event. nickname.go = normalizeNickname (ToValidUTF8, strip Cc + Bidi_Control, trim, 32 runes, \"Anonymous\"), truncateRunes, foldKey (EqualFold-equivalent key), assignNickname (lowest free \" (n)\" suffix). client.go = Client (conn, send, registered, nickname) with readPump (4096-byte limit, deadlines, pong; closes on binary/invalid UTF-8; drops blank frames) and writePump (sole conn writer, pings)"
    language: go
    entry_points:
      - internal/chat/room.go
      - internal/chat/client.go
      - internal/chat/message.go
      - internal/chat/nickname.go
    test_paths:
      - internal/chat/room_test.go
      - internal/chat/client_test.go
  - name: web-client
    path: cmd/chatroom/index.html
    description: "Single-file browser client (Nocturne design, Spanish UI) embedded via go:embed and served at GET /; join form for nickname, connects to ws(s)://location.host/ws, enforces MAX_MESSAGE_BYTES=4096 client-side, emoji panel, GIF panel (https image URL sent as a message and rendered as <img>), emoji-only bubbles; parses server frames as JSON by type (unknown types/invalid JSON ignored), identity from welcome, own messages iff from === welcome name, times from ts; text rendered with textContent; loads Inter font from Google Fonts"
    language: html/javascript
    entry_points:
      - cmd/chatroom/index.html
    test_paths: []

dependencies:
  production:
    - name: github.com/gin-gonic/gin
      version: v1.12.0
      purpose: "HTTP router (GET / and GET /ws). Marked \"// indirect\" in go.mod though imported directly — needs go mod tidy (go.mod requires go 1.27.3; all deps in one require block)"
    - name: github.com/gorilla/websocket
      version: v1.5.3
      purpose: "WebSocket upgrade and connection I/O. Also marked \"// indirect\" incorrectly"
  development: []

testing:
  framework: go stdlib testing (+ net/http/httptest, gorilla websocket Dialer for integration)
  command: go test -race ./...
  config_files: []
  coverage:
    tool: go test -cover
    threshold: null

conventions:
  commit_style: "Conventional Commits, type(scope): subject (e.g. fix(chat):, feat(ui):, docs:); first commit was \"Initial commit\""
  branch_naming: "type/slug (fix/channel-handling, feat/structured-messages); main is default"
  code_style: gofmt; no golangci-lint config
  documentation: short Go doc comments above types/functions
  examples:
    - "Constructor pattern: func NewRoom(allowedOrigins []string) *Room returns a fully initialized struct with made channels"
    - "Goroutine pumps per connection: go client.writePump(cr); go client.readPump(cr) — readPump owns unregister, writePump owns all conn writes; only Room.Run closes send"
    - "Error handling: c.logError(\"Read\", err) (logs only abnormal closes) then return; no wrapping, no custom error types"

api_surface:
  - name: WebSocket chat endpoint
    type: REST
    path: GET /ws?nickname=<string>
    description: "Upgrades to WebSocket. Inbound: plain UTF-8 text frames <=4096 bytes (blank ones ignored). Outbound: JSON {\"type\",\"from\",\"text\",\"ts\"} with type chat|join|leave|welcome (text \"\" for non-chat, ts Unix ms); welcome is the first frame and carries the assigned nickname. Nicknames normalized (control/bidi stripped, trimmed, <=32 runes, \"Anonymous\") and unique case-insensitively via \" (n)\" suffix"
    auth: null (Origin check - same-origin or ALLOWED_ORIGINS; null rejected)
  - name: Chat page
    type: REST
    path: GET /
    description: "Serves the embedded index.html with X-Content-Type-Options nosniff and X-Frame-Options DENY"
    auth: null
