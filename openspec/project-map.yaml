conventions:
  commit_style: "Conventional Commits, type(scope): subject (e.g. feat(gifs):, feat(chat):, fix(chat):, docs:); PRs merged via GitHub merge commits (\"Merge pull request #N from luscript/feat/...\")"
  branch_naming: "type/slug (feat/gif-picker, feat/typing-indicator, fix/channel-handling); main is default"
  code_style: "gofmt (snap: use /snap/go/current/bin/gofmt); no golangci-lint config; hub pattern (only Room.Run touches clients and closes send; no locks); no inline code in the page (strict CSP); image hosts in imageHosts and IMAGE_HOSTS must match"
  documentation: "short Go doc comments above types/functions that explain the why, citing spec IDs (CHAT-xx/SRV-xx); README.md documents API and protocol; CLAUDE.md for project rules"
  examples:
    - "Constructor pattern: NewRoom(id) *Room and NewServer(allowedOrigins, rooms...) *Server return fully initialized structs; programmer errors panic in NewServer"
    - "Goroutine pumps per connection: serveConn waits on client.registered, then go writePump + go readPump; writePump owns all conn writes, readPump owns unregister, only Room.Run closes send"
    - "Error handling: c.logError(roomID, op, err) logs only abnormal closes; no wrapping or custom error types; gifs.fetch returns sanitized errors.New(...) so the API key never leaks"
    - "Testability seams: unexported Room timing fields, gifSearch.baseURL/client/now injectable"

api_surface:
  - name: WebSocket chat endpoint
    type: REST
    path: GET /ws?room=<id>&nickname=<string>
    description: "Upgrades to WebSocket. room: general|juegos|musica; missing/empty -> general; unknown -> 404 (no upgrade). Inbound text frames <=4096 bytes (binary closes 1003, invalid UTF-8 closes 1007): plain text or JSON {type:chat,text} | {type:dm,to,text} | {type:typing[,to]} (typing max 1/s per connection); blank ignored. Outbound JSON with ts in Unix ms: welcome (first frame, assigned nickname), users {users:[]}, history {messages:[] <=50}, join/leave/chat {type,from,text,ts}, dm {from,to,text} (to recipient and echoed to sender), dm_error {to,reason: invalid|self|offline}, typing {from[,to]}. Nicknames normalized (control/bidi stripped, trimmed, <=32 runes, \"Anonymous\") and unique case-insensitively per room via \" (n)\" suffix"
    auth: null (Origin check - same host, no Origin header, or ALLOWED_ORIGINS; "null" rejected with 403)
  - name: Room list
    type: REST
    path: GET /rooms
    description: "Returns {\"rooms\":[\"general\",\"juegos\",\"musica\"]} in display order (default first), with nosniff and no-cache"
    auth: null
  - name: GIF search proxy
    type: REST
    path: GET /gifs?q=<string>
    description: "Only registered when GIPHY_API_KEY is set (otherwise 404). Proxies Giphy trending (q empty) or search; returns {\"gifs\":[{\"url\",\"preview\"}]} (max 24, pg-13, lang es, https giphy .gif URLs only). q over 50 runes -> 400 {\"error\":\"query_too_long\"}; upstream failure -> 502 {\"error\":\"unavailable\"}. 10 min TTL cache, 100 entries. Key never logged or returned"
    auth: null (server holds GIPHY_API_KEY)
  - name: Chat page
    type: REST
    path: GET /
    description: "Serves the embedded index.html with nosniff, Cache-Control no-cache, X-Frame-Options DENY, Referrer-Policy no-referrer and a strict Content-Security-Policy (no unsafe-inline; img-src 'self' + imageHosts over https; connect-src 'self')"
    auth: null
  - name: Page assets
    type: REST
    path: GET /app.js, GET /app.css
    description: "Embedded script and stylesheet (text/javascript, text/css; charset=utf-8) with nosniff and no-cache"
    auth: null
