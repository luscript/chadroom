modules:
  - name: chatroom-cmd
    path: cmd/chatroom
    description: Composition root; reads ALLOWED_ORIGINS, creates the Room, runs Room.Run(ctx), newRouter (GET / embedded index.html, GET /ws), http.Server on :8080 with graceful shutdown on SIGINT/SIGTERM
    language: go
    entry_points:
      - cmd/chatroom/main.go
    test_paths:
      - cmd/chatroom/main_test.go
  - name: chat
    path: internal/chat
    description: Chat hub. room.go = Room (map[*Client] registry owned by Run(ctx), fanOut, done chan, checkOrigin allowlist, HandleWebSocket); client.go = Client (conn, send chan, nickname) with readPump/writePump (read limit, deadlines, ping/pong)
    language: go
    entry_points:
      - internal/chat/room.go
      - internal/chat/client.go
    test_paths:
      - internal/chat/room_test.go
      - internal/chat/client_test.go
  - name: web-client
    path: cmd/chatroom/index.html
    description: Static browser client embedded via go:embed and served at GET /; prompts nickname, connects to ws://localhost:8080/ws, renders messages with textContent
    language: html/javascript
    entry_points:
      - cmd/chatroom/index.html
    test_paths: []

dependencies:
  production:
    - name: github.com/gin-gonic/gin
      version: v1.12.0
      purpose: HTTP router (GET / and GET /ws). Marked "// indirect" in go.mod though imported directly — needs go mod tidy
    - name: github.com/gorilla/websocket
      version: v1.5.3
      purpose: WebSocket upgrade and connection I/O. Also marked "// indirect" incorrectly
  development: []

testing:
  framework: go stdlib testing (+ net/http/httptest, gorilla websocket Dialer for integration)
  command: go test -race ./...
  config_files: []
  coverage:
    tool: go test -cover
    threshold: null

conventions:
  commit_style: none established (single "Initial commit")
  branch_naming: none established (main only)
  code_style: gofmt; no golangci-lint config
  documentation: short Go doc comments above types/functions
  examples:
    - "Constructor pattern: func NewRoom() *Room returns a fully initialized struct with made channels"
    - "Goroutine pumps per connection: go client.writePump(cr); go client.readPump(cr) — readPump owns unregister, writePump owns all conn writes; only Room.Run closes send"
    - "Error handling: log.Println(\"Read error:\", err) then return (no wrapping, no custom error types)"

api_surface:
  - name: WebSocket chat endpoint
    type: REST
    path: GET /ws?nickname=<string>
    description: Upgrades to WebSocket; each text frame received is broadcast to all clients as "<nickname>: <text>"; join/leave notices broadcast as plain text
    auth: null (Origin check - same-origin or ALLOWED_ORIGINS; null rejected)
  - name: Chat page
    type: REST
    path: GET /
    description: Serves the embedded index.html
    auth: null
