<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Nocturne design-system tokens (subset used by this page). */
  :root {
    --color-bg: #161826;
    --color-surface: #232532;
    --color-text: #e9e9ed;
    --color-accent: #9184d9;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
    --color-neutral-400: #b2b6ca;
    --color-neutral-500: #9397ab;
    --color-neutral-600: #75798c;
    --color-neutral-800: #3f424d;
    --color-accent-100: #f5f4ff;
    --color-accent-300: #d2cefd;
    --color-accent-600: #796cbf;
    --color-accent-700: #5d5294;
    --color-accent-800: #423a6a;
    --color-accent-900: #2b2741;
    --font-heading: "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --space-1: 2.8px;
    --space-2: 5.6px;
    --space-3: 8.4px;
    --space-4: 11.2px;
    --space-6: 16.8px;
    --space-8: 22.4px;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 14px;
    --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
    --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
    --gutter: clamp(16px, 4vw, 48px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  }
  h1 { font-family: var(--font-heading); font-weight: 500; font-size: 42px; line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-3); }
  p { margin: 0; }
  [hidden] { display: none !important; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  ::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
  .text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; font: 500 14px/1.2 var(--font-heading); color: var(--color-text);
    background: transparent; border: 1px solid transparent;
    padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: var(--radius-md);
  }
  .btn svg { display: block; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
  .btn-primary:not(:disabled):hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .btn-primary:not(:disabled):active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
  .btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
  .btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
  .btn-icon { width: 36px; height: 36px; padding: 0; }

  .input {
    width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px;
    color: var(--color-text); caret-color: var(--color-accent);
    background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md);
  }
  .input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
  .input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }

  .tag { display: inline-flex; align-items: center; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 6px; }
  .tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }

  /* — layout — */
  .app {
    height: 100vh; height: 100dvh; min-height: 520px; display: flex; flex-direction: column;
    background: radial-gradient(900px 420px at 0% 0%, color-mix(in srgb, var(--color-accent) 14%, transparent), transparent 70%), var(--color-bg);
  }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* — join — */
  .join { align-items: flex-start; justify-content: center; padding: var(--space-8) clamp(20px, 8vw, 120px); }
  .join form { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: var(--space-6); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--color-accent); }
  .brand span { font: 500 13px var(--font-heading); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text); }
  .field { display: flex; flex-direction: column; gap: var(--space-2); }
  .field label { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-neutral-500); }

  /* — chat header — */
  .chat-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: var(--space-4) var(--gutter); flex: none; }
  .chat-header .title { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
  .chat-header .name { font: 500 16px/1.2 var(--font-heading); }
  .chat-header .actions { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
  .chat-header .tag { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--color-neutral-400); white-space: nowrap; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }
  .status[data-state="connecting"] { --dot: var(--color-neutral-500); }
  .status[data-state="online"] { --dot: var(--color-accent); }
  .status[data-state="offline"] { --dot: var(--color-neutral-600); }
  .rule { height: 1px; flex: none; background: linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); }

  /* — messages — */
  .scroller { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-8) var(--gutter); }
  .messages { max-width: 720px; display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .msg-system { padding: var(--space-2) 0; font-size: 12px; color: var(--color-neutral-500); display: flex; align-items: center; gap: var(--space-3); }
  .msg-system::before { content: ""; width: 14px; height: 1px; flex: none; background: var(--color-accent-700); }
  .msg { display: flex; gap: var(--space-4); }
  .msg.has-head { padding-top: 12px; }
  .avatar-slot { width: 30px; flex: none; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; background: var(--color-accent-900); color: var(--color-accent-300);
    box-shadow: 0 0 0 1px var(--color-accent-800);
  }
  .msg-body { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .msg-head { display: flex; align-items: baseline; gap: var(--space-3); min-width: 0; }
  .msg-head .author { font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
  .msg-head .tag { font-size: 10px; padding: 0 6px; }
  .msg-head time { font-size: 11px; }
  .bubble {
    padding: 7px 12px; border-radius: 2px var(--radius-md) var(--radius-md) var(--radius-md);
    background: var(--color-surface); box-shadow: 0 0 0 1px var(--color-neutral-800);
    font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 100%;
  }
  .msg.own .bubble { background: var(--color-accent-900); box-shadow: 0 0 0 1px var(--color-accent-800); }
  .bubble.emoji-only { font-size: 32px; }
  .bubble.media { padding: 4px; }
  .bubble.media img { display: block; max-width: 100%; max-height: 240px; border-radius: 6px; }

  /* — composer — */
  .composer { flex: none; padding: 0 var(--gutter) var(--space-6); }
  .composer-bar {
    max-width: 720px; position: relative; display: flex; gap: var(--space-3); align-items: center;
    padding: var(--space-3); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-md);
  }
  .composer-bar .input { flex: 1; min-width: 0; border-color: transparent; background: transparent; }
  .tool { flex: none; color: var(--color-neutral-400); }
  .tool[aria-expanded="true"] { color: var(--color-accent); }
  .tool-gif { padding: 0 10px; height: 36px; font-size: 12px; letter-spacing: 0.06em; }
  .popover {
    position: absolute; left: 0; bottom: calc(100% + 10px); width: min(340px, 100%);
    padding: var(--space-3); border-radius: var(--radius-lg); background: var(--color-surface);
    box-shadow: var(--shadow-lg); z-index: 5; display: flex; flex-direction: column; gap: var(--space-3);
  }
  .popover.gif { width: min(380px, 100%); }
  .cats { display: flex; gap: var(--space-2); }
  .cats button {
    width: 34px; height: 30px; font-size: 17px; cursor: pointer; border: 0; border-radius: var(--radius-sm);
    background: transparent; color: inherit;
  }
  .cats button:hover { background: var(--color-accent-900); }
  .cats button[aria-selected="true"] { background: var(--color-accent-900); box-shadow: 0 0 0 1px var(--color-accent-700); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; max-height: 200px; overflow-y: auto; }
  .emoji-grid button { aspect-ratio: 1; font-size: 21px; line-height: 1; cursor: pointer; border: 0; border-radius: var(--radius-sm); background: transparent; padding: 0; }
  .emoji-grid button:hover { background: var(--color-accent-900); }
  .gif-row { display: flex; gap: var(--space-2); }
  .gif-row .input { flex: 1; min-width: 0; }

  @media (max-width: 560px) {
    h1 { font-size: 32px; }
    .chat-header .status-label { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <section id="join-view" class="view join">
    <form id="join-form" autocomplete="off">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,48H40A16,16,0,0,0,24,64V224a15.85,15.85,0,0,0,9.24,14.5A16.13,16.13,0,0,0,40,240a15.89,15.89,0,0,0,10.25-3.78l.09-.07L83,208H216a16,16,0,0,0,16-16V64A16,16,0,0,0,216,48ZM216,192H80a8,8,0,0,0-5.23,1.95L40,224V64H216Z"/></svg>
        <span>Chatroom</span>
      </div>
      <div>
        <h1>Entrá a la sala.</h1>
        <p class="text-muted">Elegí un apodo para que los demás sepan quién sos. Los mensajes llegan en tiempo real.</p>
      </div>
      <div class="field">
        <label for="nick">Apodo</label>
        <!-- maxlength mirrors maxNicknameRunes in internal/chat/room.go -->
        <input id="nick" class="input" type="text" maxlength="32" autofocus placeholder="Por ejemplo, Lucía">
      </div>
      <div>
        <button id="join-btn" type="submit" class="btn btn-primary" disabled>Entrar al chat</button>
      </div>
    </form>
  </section>

  <section id="chat-view" class="view" hidden>
    <header class="chat-header">
      <div class="title">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="var(--color-accent)" aria-hidden="true"><path d="M216,48H40A16,16,0,0,0,24,64V224a15.85,15.85,0,0,0,9.24,14.5A16.13,16.13,0,0,0,40,240a15.89,15.89,0,0,0,10.25-3.78l.09-.07L83,208H216a16,16,0,0,0,16-16V64A16,16,0,0,0,216,48ZM216,192H80a8,8,0,0,0-5.23,1.95L40,224V64H216Z"/></svg>
        <div>
          <div class="name">Chatroom</div>
          <div class="text-muted" style="font-size:12px">Sala general</div>
        </div>
      </div>
      <div class="actions">
        <span id="status" class="status" data-state="connecting" role="status">
          <span class="dot"></span><span class="status-label" id="status-label">Conectando…</span>
        </span>
        <span id="me" class="tag tag-accent"></span>
        <button id="leave-btn" type="button" class="btn btn-ghost">Salir</button>
      </div>
    </header>
    <div class="rule"></div>

    <div id="scroller" class="scroller">
      <ol id="messages" class="messages" aria-live="polite"></ol>
    </div>

    <form id="send-form" class="composer" autocomplete="off">
      <div class="composer-bar">
        <div id="emoji-panel" class="popover" hidden>
          <div id="cats" class="cats" role="tablist"></div>
          <div id="emoji-grid" class="emoji-grid"></div>
        </div>
        <div id="gif-panel" class="popover gif" hidden>
          <div style="font-size:13px;line-height:1.45">Pegá la URL de un GIF (https, termina en .gif) y se envía al chat.</div>
          <div class="gif-row">
            <input id="gif-url" class="input" type="url" placeholder="https://…/animado.gif">
            <button id="gif-send" type="button" class="btn btn-primary" disabled>Enviar</button>
          </div>
        </div>
        <button id="emoji-btn" type="button" class="btn btn-icon btn-ghost tool" aria-label="Emojis" title="Emojis" aria-expanded="false" aria-controls="emoji-panel">
          <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216ZM80,108a12,12,0,1,1,12,12A12,12,0,0,1,80,108Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,176,108Zm-1.07,48c-10.29,17.79-27.4,28-46.93,28s-36.63-10.2-46.92-28a8,8,0,1,1,13.84-8c7.47,12.91,19.21,20,33.08,20s25.61-7.1,33.07-20a8,8,0,0,1,13.86,8Z"/></svg>
        </button>
        <button id="gif-btn" type="button" class="btn btn-ghost tool tool-gif" aria-label="GIFs" title="GIFs" aria-expanded="false" aria-controls="gif-panel">GIF</button>
        <input id="draft" class="input" type="text" placeholder="Escribí algo…" aria-label="Mensaje">
        <button id="send-btn" type="submit" class="btn btn-primary" disabled>
          Enviar
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M231.4,44.34a15.89,15.89,0,0,0-16.1-3.38L31.5,106.9a16,16,0,0,0-1.8,29.55l82.6,39.25,39.25,82.6A15.87,15.87,0,0,0,166.2,268h.6a15.88,15.88,0,0,0,14.4-11.1L235,72.4A15.89,15.89,0,0,0,231.4,44.34ZM166.5,251.9l-34.7-73a8,8,0,0,0-3.7-3.7l-73-34.7L218.3,57.7Z" transform="translate(0 -12)"/></svg>
        </button>
      </div>
    </form>
  </section>

</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MAX_MESSAGE_BYTES = 4096; // defaultMaxMessageSize in internal/chat/room.go

  const CATS = [
    { name: 'Caras', icon: '😀', list: '😀 😃 😄 😁 😆 😅 😂 🤣 🙂 😉 😊 😇 🥰 😍 🤩 😘 😋 😛 😜 🤪 🤔 🤨 😐 😑 😶 🙄 😏 😴 😮 😲 😢 😭 😤 😡 🥳 😎 🤓 🥺 😱 🤯 😬 🫠 🤗 🫡' },
    { name: 'Gestos', icon: '👍', list: '👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 👋 🤚 ✋ 🖖 👏 🙌 🫶 🙏 🤝 💪 ✍️ 🫰 🫵 👀 🧠 💀 👻 🤖' },
    { name: 'Corazones y símbolos', icon: '❤️', list: '❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 💕 💖 💯 ✨ ⭐ 🔥 💥 ⚡ 🎉 🎊 ✅ ❌ ❓ ❗ 💡 💬 🔔' },
    { name: 'Cosas', icon: '🍕', list: '🍕 🍔 🍟 🌮 🍣 🍩 🍪 🍫 ☕ 🍺 🍷 🎂 ⚽ 🏀 🎮 🎧 🎸 🚀 🌈 🌙 ☀️ 🌧️ 🐶 🐱 🦊 🐼 🐸 🦄' },
  ];
  const STATUS_LABEL = { connecting: 'Conectando…', online: 'En línea', offline: 'Desconectado' };
  // Only https images are rendered inline; anything else stays as plain text.
  const IMAGE_URL = /^https:\/\/[^\s"'<>]+\.(gif|webp|png|jpe?g)(\?[^\s"'<>]*)?$/i;
  const EMOJI_ONLY = /^(\p{Extended_Pictographic}|️|‍|\s){1,12}$/u;

  let ws = null;
  let myName = ''; // identity assigned by the server in the welcome frame
  let status = 'connecting';
  let lastAuthor = null;

  // — join —
  const nickInput = $('nick');
  nickInput.addEventListener('input', () => { $('join-btn').disabled = !nickInput.value.trim(); });
  $('join-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const nick = nickInput.value.trim();
    if (nick) join(nick);
  });

  function join(nick) {
    myName = '';
    lastAuthor = null;
    $('messages').replaceChildren();
    $('me').textContent = nick;
    $('me').title = nick;
    $('join-view').hidden = true;
    $('chat-view').hidden = false;
    setStatus('connecting');
    $('draft').focus();

    const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const socket = new WebSocket(scheme + location.host + '/ws?nickname=' + encodeURIComponent(nick));
    ws = socket;
    socket.onopen = () => setStatus('online');
    socket.onmessage = (e) => addRaw(e.data);
    socket.onclose = () => {
      if (ws !== socket) return; // the user left on purpose
      setStatus('offline');
      addSystem('Desconectado. No se pudo mantener la conexión con el servidor.');
    };
  }

  $('leave-btn').addEventListener('click', () => {
    if (ws) { const s = ws; ws = null; s.close(); }
    closePanels();
    $('draft').value = '';
    $('chat-view').hidden = true;
    $('join-view').hidden = false;
    nickInput.focus();
  });

  function setStatus(s) {
    status = s;
    $('status').dataset.state = s;
    $('status-label').textContent = STATUS_LABEL[s];
    updateSendState();
  }

  // — messages —
  // The server sends JSON frames {type, from, text, ts}; ts is Unix milliseconds.
  function addRaw(data) {
    let msg;
    try { msg = JSON.parse(data); } catch { return; }
    if (!msg || typeof msg.from !== 'string') return;
    switch (msg.type) {
      case 'welcome':
        myName = msg.from;
        $('me').textContent = myName;
        $('me').title = myName;
        break;
      case 'chat':
        if (typeof msg.text === 'string') addChat(msg.from, msg.text, msg.ts);
        break;
      case 'join':
        addSystem(msg.from + ' se unió 🎉');
        break;
      case 'leave':
        addSystem(msg.from + ' salió 👋');
        break;
      // Unknown types are ignored so newer servers don't break this page.
    }
  }

  function addSystem(text) {
    lastAuthor = null;
    const li = document.createElement('li');
    li.className = 'msg-system';
    li.textContent = text;
    append(li);
  }

  function addChat(author, text, ts) {
    const own = author === myName;
    const showHead = author !== lastAuthor;
    lastAuthor = author;

    const li = document.createElement('li');
    li.className = 'msg' + (own ? ' own' : '') + (showHead ? ' has-head' : '');

    const slot = document.createElement('div');
    slot.className = 'avatar-slot';
    const body = document.createElement('div');
    body.className = 'msg-body';

    if (showHead) {
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = (Array.from(author)[0] || '?').toUpperCase();
      slot.append(avatar);

      const head = document.createElement('div');
      head.className = 'msg-head';
      const name = document.createElement('span');
      name.className = 'author';
      name.textContent = author;
      head.append(name);
      if (own) {
        const tag = document.createElement('span');
        tag.className = 'tag tag-accent';
        tag.textContent = 'vos';
        head.append(tag);
      }
      const time = document.createElement('time');
      time.className = 'text-muted';
      time.textContent = (Number.isFinite(ts) ? new Date(ts) : new Date()).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
      head.append(time);
      body.append(head);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (IMAGE_URL.test(text)) {
      bubble.classList.add('media');
      const img = document.createElement('img');
      img.src = text;
      img.alt = 'GIF';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.onload = scrollToBottom;
      // Fall back to the plain link text if the image can't be loaded.
      img.onerror = () => { bubble.classList.remove('media'); bubble.textContent = text; };
      bubble.append(img);
    } else {
      if (EMOJI_ONLY.test(text)) bubble.classList.add('emoji-only');
      bubble.textContent = text;
    }
    body.append(bubble);

    li.append(slot, body);
    append(li);
  }

  function append(node) {
    $('messages').append(node);
    scrollToBottom();
  }

  function scrollToBottom() {
    const el = $('scroller');
    el.scrollTop = el.scrollHeight;
  }

  // — sending —
  const draft = $('draft');
  draft.addEventListener('input', updateSendState);

  function updateSendState() {
    $('send-btn').disabled = !draft.value.trim() || status !== 'online';
  }

  function sendText(text) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return false;
    if (new TextEncoder().encode(text).length > MAX_MESSAGE_BYTES) {
      addSystem('El mensaje es demasiado largo.');
      return false;
    }
    ws.send(text);
    return true;
  }

  $('send-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = draft.value.trim();
    if (text && sendText(text)) {
      draft.value = '';
      closePanels();
      updateSendState();
    }
  });

  // — emoji & GIF panels —
  const panels = {
    emoji: { panel: $('emoji-panel'), btn: $('emoji-btn') },
    gif: { panel: $('gif-panel'), btn: $('gif-btn') },
  };

  function togglePanel(key) {
    const opening = panels[key].panel.hidden;
    closePanels();
    if (!opening) return;
    panels[key].panel.hidden = false;
    panels[key].btn.setAttribute('aria-expanded', 'true');
    if (key === 'gif') $('gif-url').focus();
  }

  function closePanels() {
    for (const { panel, btn } of Object.values(panels)) {
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }
  }

  panels.emoji.btn.addEventListener('click', () => togglePanel('emoji'));
  panels.gif.btn.addEventListener('click', () => togglePanel('gif'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanels(); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.popover, .tool')) closePanels();
  });

  CATS.forEach((cat, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.role = 'tab';
    b.textContent = cat.icon;
    b.title = cat.name;
    b.setAttribute('aria-label', cat.name);
    b.addEventListener('click', () => selectCat(i));
    $('cats').append(b);
  });

  function selectCat(i) {
    [...$('cats').children].forEach((b, j) => b.setAttribute('aria-selected', String(i === j)));
    const grid = $('emoji-grid');
    grid.replaceChildren(...CATS[i].list.split(' ').map((ch) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', () => {
        draft.value += ch;
        updateSendState();
      });
      return b;
    }));
  }
  selectCat(0);

  const gifUrl = $('gif-url');
  gifUrl.addEventListener('input', () => { $('gif-send').disabled = !IMAGE_URL.test(gifUrl.value.trim()); });
  gifUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('gif-send').click(); } });
  $('gif-send').addEventListener('click', () => {
    const url = gifUrl.value.trim();
    if (IMAGE_URL.test(url) && sendText(url)) {
      gifUrl.value = '';
      $('gif-send').disabled = true;
      closePanels();
    }
  });
})();
</script>
</body>
</html>
